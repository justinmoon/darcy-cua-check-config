cvm-version: 0.14.16
cpus: 2
memory: 8192
networks:
  checks:
    egress: allowlist
    allow: []
containers:
  - name: checks
    image: ghcr.io/justinmoon/darcy-cua-check-config@sha256:9f86c3a4bbc4431e729cdba4f7d40ef9f49668ce28af2a516375f01e0b1af80d
    cvm_admin: true
    user: "0:0"
    read_only: true
    pids_limit: 512
    shm_size: 512m
    networks: [checks]
    tmpfs:
      /run: rw,nosuid,nodev,size=64m,mode=755
      /tmp: rw,nosuid,nodev,size=1g,mode=1777
      /workspace: rw,nosuid,nodev,size=2g,mode=755
shim:
  upstream-port: 8080
  authenticated: false
  paths: [/healthz]
