cvm-version: 0.14.16
cpus: 2
memory: 8192
networks:
  checks:
    egress: allowlist
    allow: []
containers:
  - name: checks
    image: ghcr.io/justinmoon/darcy-cua-check-config@sha256:4bd77bac420711b1925e32a5e31e54e7c9c56c9014c03ae666c27c8ebeac02f9
    cvm_admin: true
    user: "0:0"
    read_only: true
    pids_limit: 512
    shm_size: 512m
    networks: [checks]
    tmpfs:
      /tmp: rw,nosuid,nodev,size=1g,mode=1777
      /workspace: rw,nosuid,nodev,size=2g,mode=755
shim:
  upstream-port: 8080
  authenticated: false
  paths: [/healthz]
