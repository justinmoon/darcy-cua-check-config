cvm-version: 0.14.16
cpus: 2
memory: 8192
networks:
  checks:
    egress: allowlist
    allow: []
containers:
  - name: checks
    image: ghcr.io/justinmoon/darcy-cua-check-config@sha256:d1b87f654536b5f65fc7ee49b9e3bae28b9a04e83524fadb4b2d5bcb5adad198
    cvm_admin: true
    user: "0:0"
    read_only: true
    pids_limit: 512
    shm_size: 512m
    networks: [checks]
    tmpfs:
      /run: rw,nosuid,nodev,size=64m,mode=755
      /tmp: rw,nosuid,nodev,size=1g,mode=1777
      /workspace: rw,nosuid,nodev,size=2g,mode=755
shim:
  upstream-port: 8080
  authenticated: false
  paths: [/healthz]
